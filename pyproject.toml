[build-system]
requires = ["scikit-build-core>=0.4.3", "nanobind>=1.9.2"]
build-backend = "scikit_build_core.build"

[project]
name = "axiomgraph"
version = "0.1.1"
description = "Hybrid Graph-Vector Database for AI Agents"
requires-python = ">=3.8"
dependencies = [
    "numpy",
]

[tool.scikit-build]
cmake.args = ["-GNinja"]
cmake.build-type = "Release"
build.verbose = true
sdist.exclude = ["build", "tests", "examples"]
wheel.packages = ["axiomgraph"]

[tool.cibuildwheel]
build = ["cp310-*", "cp311-*", "cp312-*"]
skip = ["*-musllinux*"]
archs = ["auto64"]
manylinux-x86_64-image = "manylinux_2_28"

[tool.cibuildwheel.linux]
environment = { PATH = "/usr/local/cuda/bin:$PATH", CUDACXX = "/usr/local/cuda/bin/nvcc" }
before-all = """
dnf install -y dnf-plugins-core && \
dnf config-manager --add-repo https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo && \
dnf install -y cuda-toolkit-12-6
"""

[tool.cibuildwheel.macos]
before-all = "brew install libomp"

[tool.cibuildwheel.windows]
before-build = "pip install delvewheel"
repair-wheel-command = "delvewheel repair -w {dest_dir} {wheel}"