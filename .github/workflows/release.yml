name: Build and Publish Wheels
on:
  push:
    tags:
      - 'v*'

jobs:
  build_wheels:
    name: Build ${{ matrix.variant }} wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            variant: cpu
          - os: ubuntu-latest
            variant: gpu
          - os: windows-2022
            variant: cpu
          - os: macos-latest
            variant: cpu

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure Linux GPU variant
        if: matrix.variant == 'gpu'
        run: |
          sed -i 's/name = "axiomgraph"/name = "axiomgraph-gpu"/' pyproject.toml
          sed -i 's/requires = \[/requires = ["libcuvs-cu12", "libraft-cu12", "cmake>=3.30.4", /' pyproject.toml
        shell: bash

      - name: Configure CPU variant
        if: matrix.variant == 'cpu'
        run: |
          echo "CIBW_ENVIRONMENT=SKBUILD_CMAKE_ARGS='-DENABLE_CUDA=OFF'" >> $GITHUB_ENV
        shell: bash

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.17.0
        
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.variant }}
          path: ./wheelhouse/*.whl

  release:
    name: Upload to GitHub Release
    needs: build_wheels
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*.whl
