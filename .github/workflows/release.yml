name: Build and Publish Wheels
on:
  push:
    tags:
      - 'v*'

jobs:
  build_wheels:
    name: Build ${{ matrix.variant }} wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            variant: cpu
          - os: ubuntu-latest
            variant: gpu
          - os: windows-2022
            variant: cpu
          - os: windows-2022
            variant: gpu
          - os: macos-latest
            variant: cpu

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install CUDA Toolkit (Windows GPU)
        if: runner.os == 'Windows' && matrix.variant == 'gpu'
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: '12.6.0'

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CPU variant
        if: matrix.variant == 'cpu'
        run: |
          python -c "import re; data=open('pyproject.toml').read(); open('pyproject.toml', 'w').write(re.sub(r'name = \"axiomgraph\"', 'name = \"axiomgraph-cpu\"', data))"
          echo "CIBW_ENVIRONMENT=SKBUILD_CMAKE_ARGS='-DENABLE_CUDA=OFF'" >> $GITHUB_ENV
        shell: bash

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.17.0
        
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.variant }}
          path: ./wheelhouse/*.whl

  release:
    name: Upload to GitHub Release
    needs: build_wheels
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*.whl
